<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nohvum Open Graph image (artboard 1c)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; background: #fff; }
  .og {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr; padding: 64px 72px 72px;
    background: var(--hero-gradient); color: #fff;
  }
  .og__brand { display: flex; align-items: center; gap: 18px; }
  .og__brand img { display: block; width: auto; }
  .og__title {
    margin: 0; align-self: end; max-width: 1000px;
    font-family: var(--font-display); font-size: 60px; line-height: 1.06; letter-spacing: -.03em; font-weight: 500;
    color: rgba(255,255,255,.9); text-wrap: pretty;
  }
  .og__title strong { font-weight: 700; color: #fff; }
</style>
</head>
<body>
<div class="og">
  <div class="og__brand">
    <img src="assets/logo-mark-white.png" alt="" style="height: 66px;">
    <img src="assets/logo-wordmark-white.png" alt="" style="height: 28px;">
  </div>
  <h2 class="og__title">AI-DLC driven software delivery for <strong>Healthcare, Life Sciences &amp; Financial Services</strong></h2>
</div>
</body>
</html>
